[project]
name = "cl-actividad-12"
version = "0.1.0"
description = "Actividad 12 - Busqueda informada en grafos: Greedy Best-First Search y A*"
readme = "README.md"
authors = [
    { name = "Angel Rugerio", email = "201720@iberopuebla.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "busqueda"

[tool.fastapi]
entrypoint = "main:app"
