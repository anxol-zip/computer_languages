[project]
name = "cl-actividad-13"
version = "0.1.0"
description = "Actividad 13 - Automatas (A6), complejidad (A11), busqueda informada (A12) y algoritmos P, NP y con heuristica (A13)"
readme = "README.md"
authors = [
    { name = "Angel Rugerio", email = "201720@iberopuebla.mx" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115",
]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

# cuatro modulos independientes dentro de src/ (uno por actividad)
[tool.uv.build-backend]
module-name = ["automatas", "complejidad", "busqueda", "pnp"]

[tool.fastapi]
entrypoint = "main:app"

